<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <link rel="icon" type="image/x-icon" href="img/bleu.png">

    <title>Make your choice</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body class="fond-choix">
    <div class="drapeaux">
        <img src="img/flag-fr.jpg" class="drapeau" data-lang="fr" onclick="event.stopPropagation()">
        <img src="img/flag-sc.jpg" class="drapeau" data-lang="kr" onclick="event.stopPropagation()">
        <img src="img/flag-eng.jpg" class="drapeau" data-lang="en" onclick="event.stopPropagation()">
    </div>
    <div class="hero" id="hero">

    <div class="fond"></div>

    <div class="choix">

        <button class="btn btn-interactif" data-bg="img/fond-interactif-2.png" data-translate="interactif">
            Explorer le trajet parcouru
        </button>

        <button class="btn btn-documentaire" id="btn-documentaire" data-bg="img/documentaire.png" data-translate="documentaire">
            Regarder le documentaire
        </button>

         <p id="description-hover" class="description"></p>
        

        

    </div>

</div>
<div id="videoOverlay" class="videoOverlay">
    <div class="videoContainer">

        <img src="img/croix-rouge.png"
             id="closeVideo"
             class="closeVideo">

        <iframe
            id="videoFrame"
            src=""
            allow="autoplay; fullscreen">
        </iframe>

    </div>
</div>
<!-- -->

  <script src="translations.js"></script>  
</body>
</html>
