<!DOCTYPE html>
<html>
<head>
    <title>GPX Path Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        #map { height: 500px; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet-GPX Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/2.1.0/gpx.js"></script>

    <script>
        // Initialize the map
        var map = L.map('map').setView([35.144, 129.036], 13);

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Load and display the GPX file
        var gpxFile = 'marche.gpx'; // Replace with your file URL
        new L.GPX(gpxFile, {
            async: true,
            polyline_options: {
                color: 'red',
                opacity: 1,
                weight: 3,
                lineCap: 'round'
            }
        }).on('loaded', function(e) {
            map.fitBounds(e.target.getBounds());
        }).addTo(map);

        
    </script>
</body>
</html>
